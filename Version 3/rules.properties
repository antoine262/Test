# Réglages des règles custom. Modifiables sans recompiler le code des règles.
# Pour utiliser un autre fichier en production : -Dvalidation.rules.file=/chemin/rules.properties
# (les clés du fichier externe écrasent celles-ci)

# Order : pays vers lesquels l'alcool peut être livré (codes séparés par des virgules)
alcohol.allowed-countries=FR

# Order : couples "A:B" (séparés par des virgules) -> si une ligne A est présente, les lignes B sont interdites
incompatible-categories=ALCOHOL:HAZMAT

# Order : montant maximum (somme quantité x prix unitaire)
order.max-amount=50000

# User : pays pour lesquels le code postal doit correspondre au département
user.department-check-countries=FR
